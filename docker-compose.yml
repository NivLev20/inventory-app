# Local environment, needs only Docker:  docker compose up --build -d
# Everything is served on http://localhost:8080 (the dashboard proxies /api to the backend)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory_dev_pw}
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: inventory-backend:local
    environment:
      DATABASE_URL: postgresql://inventory:${POSTGRES_PASSWORD:-inventory_dev_pw}@db:5432/inventory
      APP_ENV: local
      SEED_DATA: "true"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: inventory-frontend:local
    environment:
      BACKEND_URL: http://backend:5000
    ports:
      - "8080:8080"
    depends_on:
      - backend

  # Store activity, like the Kubernetes CronJobs: sales every minute, a new product every 2 minutes.
  # Pause and resume it from the dashboard.
  simulator:
    build: ./backend
    image: inventory-backend:local
    environment:
      SIM_API_URL: http://backend:5000
    command:
      - sh
      - -c
      - |
        sleep 20
        i=0
        while true; do
          python simulator.py sales
          [ $$((i % 2)) -eq 0 ] && python simulator.py new-product
          i=$$((i + 1))
          sleep 60
        done
    healthcheck:
      disable: true   # the image's check looks for the API server, which this container does not run
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
