# Run the whole system locally with one command:
#   docker compose up --build
# Dashboard: http://localhost:8080      API: http://localhost:5000/api/products
services:
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory_dev_pw}
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    restart: unless-stopped
    build: ./backend
    image: inventory-backend:local
    environment:
      DATABASE_URL: postgresql://inventory:${POSTGRES_PASSWORD:-inventory_dev_pw}@db:5432/inventory
      APP_ENV: local
      SEED_DATA: "true"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    build: ./frontend
    image: inventory-frontend:local
    environment:
      BACKEND_URL: http://backend:5000
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  pgdata:
